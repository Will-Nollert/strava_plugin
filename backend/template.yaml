AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Strava Plugin OAuth Proxy Service with Weather API Support

# Parameters you can customize during deployment
Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name
  StravaClientSecret:
    Type: String
    NoEcho: true
    Description: Strava API Client Secret
  OpenWeatherApiKey:
    Type: String
    NoEcho: true
    Description: OpenWeatherMap API Key
  WeatherCacheTTL:
    Type: Number
    Default: 3600
    Description: Weather cache time-to-live in seconds (default 1 hour)
  SegmentCacheTTL:
    Type: Number
    Default: 604800
    Description: Segment cache time-to-live in seconds (default 1 week)

# Resources to create
Resources:
  # DynamoDB table for API response caching
  ApiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "strava-plugin-cache-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiry
        Enabled: true

  # API Gateway for the OAuth Proxy and Weather
  StravaApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET, POST, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization'"
        AllowOrigin: "'chrome-extension://oidkimpnlebgbjmkmmploaoplogcflme'"

  # Lambda function to handle OAuth and Weather requests
  StravaOAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          STRAVA_CLIENT_SECRET: !Ref StravaClientSecret
          OPENWEATHER_API_KEY: !Ref OpenWeatherApiKey
          CACHE_TABLE_NAME: !Ref ApiCacheTable
          WEATHER_CACHE_TTL: !Ref WeatherCacheTTL
          SEGMENT_CACHE_TTL: !Ref SegmentCacheTTL
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiCacheTable
        - Statement:
            - Effect: Allow
              Action:
                - "dynamodb:GetItem"
                - "dynamodb:PutItem"
                - "dynamodb:DeleteItem"
                - "dynamodb:Scan"
                - "dynamodb:Query"
              Resource: !GetAtt ApiCacheTable.Arn
      Events:
        TokenExchange:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /token
            Method: POST
        TokenRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /refresh
            Method: POST
        WeatherProxy:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /weather
            Method: GET
        SegmentProxy:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segment/{segmentId}
            Method: GET
        OptionsToken:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /token
            Method: OPTIONS
        OptionsRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /refresh
            Method: OPTIONS
        OptionsWeather:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /weather
            Method: OPTIONS
        OptionsSegment:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segment/{segmentId}
            Method: OPTIONS
