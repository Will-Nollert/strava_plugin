AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Strava Plugin OAuth Proxy Service with Weather API Support and Caching

# Parameters you can customize during deployment
Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name
  StravaClientSecret:
    Type: String
    NoEcho: true
    Description: Strava API Client Secret
  OpenWeatherApiKey:
    Type: String
    NoEcho: true
    Description: OpenWeatherMap API Key
  SegmentCacheTTL:
    Type: Number
    Default: 604800 # 7 days in seconds
    Description: Time to live for segment cache entries (in seconds)
  WeatherCacheTTL:
    Type: Number
    Default: 3600 # 1 hour in seconds
    Description: Time to live for weather cache entries (in seconds)

# Resources to create
Resources:
  # API Gateway for the OAuth Proxy and Weather
  StravaApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET, POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'https://www.strava.com'"

  # Lambda function to handle OAuth and Weather requests
  StravaOAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          STRAVA_CLIENT_SECRET: !Ref StravaClientSecret
          OPENWEATHER_API_KEY: !Ref OpenWeatherApiKey
          SEGMENT_CACHE_TTL: !Ref SegmentCacheTTL
          WEATHER_CACHE_TTL: !Ref WeatherCacheTTL
          SEGMENT_CACHE_TABLE: !Ref SegmentCacheTable
          WEATHER_CACHE_TABLE: !Ref WeatherCacheTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SegmentCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeatherCacheTable
      Events:
        TokenExchange:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /token
            Method: POST
        TokenRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /refresh
            Method: POST
        WeatherProxy:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /weather
            Method: GET
        SegmentProxy:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segment/{segmentId}
            Method: GET
        StarredSegmentsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segments/starred
            Method: GET
        OptionsToken:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /token
            Method: OPTIONS
        OptionsRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /refresh
            Method: OPTIONS
        OptionsWeather:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /weather
            Method: OPTIONS
        OptionsSegment:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segment/{segmentId}
            Method: OPTIONS
        OptionsStarredSegments:
          Type: Api
          Properties:
            RestApiId: !Ref StravaApiGateway
            Path: /segments/starred
            Method: OPTIONS

  # DynamoDB table for segment data cache
  SegmentCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "strava-plugin-cache-segments-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: segmentId
          AttributeType: S
      KeySchema:
        - AttributeName: segmentId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # DynamoDB table for weather data cache
  WeatherCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "strava-plugin-cache-weather-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationKey
          AttributeType: S
      KeySchema:
        - AttributeName: locationKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

# Output values
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${StravaApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  OAuthFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt StravaOAuthFunction.Arn
  SegmentCacheTable:
    Description: DynamoDB table for segment cache
    Value: !Ref SegmentCacheTable
  WeatherCacheTable:
    Description: DynamoDB table for weather cache
    Value: !Ref WeatherCacheTable
