name: Feature Branch CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install webpack and babel dependencies
        run: npm install --save-dev webpack webpack-cli copy-webpack-plugin html-webpack-plugin babel-loader @babel/core @babel/preset-env

      - name: Build extension (dev mode)
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          AUTH_PROXY_URL: ${{ secrets.AUTH_PROXY_URL }}
        run: npm run build:dev

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dev-build
          path: dist/
          retention-days: 7